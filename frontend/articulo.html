<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artículo — Revision2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/styles.css" />
</head>

<body data-page="detail">
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold" href="index.html">Revision2</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="articulos.html">Artículos</a></li>
                    <li class="nav-item"><a class="nav-link" href="export.html">Exportar</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container py-3">
        <div class="d-flex align-items-center justify-content-between mb-2">
            <div class="d-flex flex-column">
                <h4 class="mb-0" id="artTitle">Artículo</h4>
                <small class="text-muted">PDF: <span id="artPdf"></span> · <a id="openPdf"
                        target="_blank">Abrir</a></small>
            </div>
            <div class="d-flex align-items-center gap-2">
                <div class="progress" style="width:220px;height:10px">
                    <div id="progressBar" class="progress-bar" role="progressbar" style="width:0%"></div>
                </div>
                <span id="progressText" class="text-muted small">0/0</span>
                <a class="btn btn-outline-secondary btn-sm" href="articulos.html">Volver</a>
            </div>
        </div>


        <div class="row g-3">
            <div class="col-12">
                <div class="card shadow-soft">
                    <div class="card-body">
                        <label class="form-label">Resumen del artículo</label>
                        <textarea id="txtResumen" class="form-control autosize" rows="4"
                            placeholder="Escribe tu síntesis..."></textarea>
                        <div class="d-flex gap-2 mt-2">
                            <button class="btn btn-secondary btn-sm" id="btnSaveResumen">Guardar resumen</button>
                            <small class="text-muted" id="resumenInfo">0 palabras</small>
                        </div>
                    </div>
                </div>
            </div>


            <div class="col-lg-3">
                <div class="card shadow-soft sticky-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <h6 class="mb-0">Preguntas</h6>
                            <span class="small text-muted">clic para saltar</span>
                        </div>
                        <input id="qSearch" class="form-control form-control-sm mb-2" placeholder="Buscar" />
                        <div id="qNav" class="list-group small"></div>
                    </div>
                </div>
            </div>


            <div class="col-lg-9">
                <div id="qWrap"></div>
                <div class="d-grid">
                    <button class="btn btn-success btn-lg" id="btnSaveAll">Guardar todas</button>
                </div>
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
</body>

</html>
