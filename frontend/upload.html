<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Subir PDFs — Revision2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/styles.css" />
</head>

<body data-page="upload">
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold" href="index.html">Revision2</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="upload.html">Subir PDFs</a></li>
                    <li class="nav-item"><a class="nav-link" href="articulos.html">Artículos</a></li>
                    <li class="nav-item"><a class="nav-link" href="export.html">Exportar</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container py-4">
        <h3 class="mb-3">Subida de artículos (PDF)</h3>
        <div class="card shadow-soft">
            <div class="card-body">
                <form id="uploadForm">
                    <div class="mb-3">
                        <label class="form-label">Selecciona uno o varios PDFs</label>
                        <input id="pdfFiles" class="form-control" type="file" accept="application/pdf" multiple />
                        <div class="form-text">El título se tomará del nombre del archivo.</div>
                    </div>
                    <button class="btn btn-primary" type="submit">Subir</button>
                </form>
                <div class="mt-4" id="uploadResults" style="display:none">
                    <h6>Resultados de la subida</h6>
                    <ul id="uploadedList" class="list-group small"></ul>
                </div>
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
</body>

</html>
